compliance:
  forbidden_phrases:
    # The next step is the person: nothing to fill in the conversation. Naming what the customer asked for is not offering it.
    - '\b(preench\w*|envi\w*|mand\w*|pass\w*|segue|devolv\w*|respond\w*)\b.{0,30}\b(formulário|pré-cadastro|ficha)\b'
    - '\bpreench\w* (o |a |os |um |uma |seu |sua |seus |esse |essa |esses )?(cadastro|dados|proposta)\b'
    - "contempla(ção|do|da) garantid"
    - "garant\\w* (a |de |sua )?contempla"
    - "aprova(ção|do|da) garantid"
    - "(em|no) (\\d+|poucos) (dias|meses) (você )?(é|será|vai ser) contemplad"
    - "grupo que (mais )?contempla (mais )?rápido"
    - "comiss(ão|ões)"
    # A result nobody can promise, and pressure that a person may not repeat here
    - '\blucr(o|os|ar|ativ\w*)\b'
    - '\brentabilidade\b|\brentável\b'
    - 'retorno (garantid|cert|alt)'
    - 'chances? .{0,30}(enorme|alta|grande|muito boa)'
    - '(poucas|últimas) vagas|vagas limitadas'
    - 'só (vale )?até hoje|última chance|oportunidade única'
    - 'contempl\w+ (rápido|em pouco tempo|logo)'
    - '(até|ate) (a )?meia[- ]noite|(fecha|acaba|encerra)\w* hoje|fechamento (do |de )?(mês|hoje)|cotas? reservad'
    - '(empresa|administradora|ela) (compra|recompra|garante a compra)|compra (garantida|de todas)|comprador(es)? garantid|venda garantida'
    - '(fazer|ganhar|tirar) (uma |um(a)? boa )?grana|dinheiro no bolso|mud(a|ar) (a |de |sua )?vida|renda (extra|mensal|passiva) (garantid|cert)'
    - 'investimento (seguro|garantid|sem risco|certo)|(melhor|ótimo|excelente|grande|baita) (investimento|negócio)'
    - '\b(cdb|cdi|poupança|poupanca|tesouro)\b.{0,60}\b(rend\w*|ganh\w*|retorno|lucr\w*|perd\w*|melhor|pior)\b'
    - '\b(rend\w*|ganh\w*|retorno|melhor|pior)\b.{0,60}\b(cdb|cdi|poupança|poupanca|tesouro)\b'
    - 'sem (consulta|análise) (de |do )?(crédito|cpf|nome)|sem burocracia'
    - "deposit\\w* na minha conta"
    - "já (fechei|garanti) (a |sua )?cota"
    # calling the product a loan is the violation; comparing ("diferente do financiamento...") is what the approved FAQ does
    - '\b(seu|sua|deste|desse|este|esse|nosso|para o) (financiamento|emprestimo|empréstimo)\b'
    - '\b(financiamento|emprestimo|empréstimo) d[oa] (seu|sua)\b'
    - 'consórcio é (um |uma )?(tipo de |forma de )?(financiamento|emprestimo|empréstimo)'
  required_disclosures:
    simulation_estimate: "Valores estimados com base na tabela vigente. As condições finais constam no contrato e no regulamento do grupo."
    history_not_guarantee: "Isso é histórico de assembleias anteriores e não garante resultado futuro."
  never_request: [cpf, rg, income, assets, bank_data, health_data]
  require_with:
    'sem juros': 'taxa de administra'
    'sem entrada': 'primeira parcela|taxa de administra'
  extra_rules: [contracting_only_in_official_system, no_contemplation_confirmation, credit_paid_to_seller_of_good_only]
faqs_seed:
  - id: what_is
    question: O que é consórcio?
    variants: ["como funciona o consórcio", "o que é um consórcio", "consórcio funciona como?"]
    answer: "Consórcio é uma forma de compra em grupo: as pessoas pagam parcelas mensais e, todo mês, parte do grupo é contemplada por sorteio ou lance para usar a carta de crédito. Não tem juros, mas tem taxa de administração e fundo de reserva, conforme o regulamento do grupo."
  - id: contemplation
    question: Como funciona a contemplação?
    variants: ["quando eu sou contemplado", "como sou sorteado", "como funciona o sorteio"]
    answer: "A contemplação acontece nas assembleias do grupo, por sorteio ou por lance, conforme o contrato e o regulamento. Não existe prazo garantido."
  - id: insurance
    question: O seguro prestamista é obrigatório?
    variants: ["preciso fazer seguro", "seguro é obrigatório", "o que é seguro prestamista"]
    answer: "As regras do seguro prestamista constam no contrato do grupo. O custo é sempre informado."
  - id: regulated
    question: Consórcio é regulamentado?
    variants: ["quem fiscaliza o consórcio", "consórcio é legal", "é pirâmide?", "tem algum órgão por trás"]
    answer: "Sim. O consórcio é regulado pela Lei 11.795/2008, e as administradoras são autorizadas e fiscalizadas pelo Banco Central. Antes de qualquer pagamento, o consultor mostra o contrato e o regulamento do grupo."
  - id: down_payment
    question: Precisa de entrada?
    variants: ["tem entrada", "preciso dar entrada", "quanto preciso ter para começar"]
    answer: "O consórcio não pede entrada como um financiamento: você começa pagando a primeira parcela, que também inclui taxa de administração e fundo de reserva, conforme o regulamento do grupo."
  - id: never_contemplated
    question: E se eu nunca for contemplado?
    variants: ["e se eu não for sorteado", "e se chegar no fim e eu não for contemplado", "o dinheiro é meu no final"]
    answer: "Não existe prazo garantido para a contemplação: ela acontece nas assembleias, por sorteio ou lance, ao longo do grupo. O que acontece até o encerramento do grupo está no contrato e no regulamento, e o consultor mostra essas regras antes de você decidir."
  - id: giving_up
    question: E se eu desistir?
    variants: ["posso cancelar depois", "se eu cancelar pego o dinheiro de volta", "se eu parar de pagar"]
    answer: "Quem desiste tem direito à devolução do que pagou ao fundo do grupo, com os descontos previstos, mas não na hora: o momento e o valor seguem a lei e o contrato. O consultor mostra as regras do grupo antes de você decidir."
  - id: readjustment
    question: A parcela aumenta com o tempo?
    variants: ["a parcela sobe com a inflação", "a parcela é fixa", "tem reajuste"]
    answer: "A parcela e o crédito são reajustados pelo índice previsto no contrato do grupo, normalmente uma vez por ano. O índice de cada grupo está no regulamento."
  - id: cheaper_good
    question: E se o bem custar menos que o crédito?
    variants: ["se o imóvel for mais barato que a carta", "e se sobrar crédito"]
    answer: "O que sobra do crédito pode ter outro destino, como abater parcelas, conforme o contrato e o regulamento do grupo. O consultor confirma como funciona no seu caso."
  # What people asked before deciding, in conversations that went on with the seller (11/2026). Drafts: the owner decides.
  - id: need_the_amount
    question: Preciso ter o valor da carta?
    variants: ["preciso ter os 100 mil", "tenho que ter esse dinheiro", "o valor da carta eu preciso ter", "preciso ter o dinheiro todo"]
    answer: "Não. A carta de crédito é o valor que você recebe quando for contemplado. Até lá, você paga só as parcelas mensais, conforme o contrato do grupo."
  - id: pay_ahead
    question: Se eu adiantar parcelas, sou contemplado antes?
    variants: ["posso pagar adiantado", "se eu pagar tudo de uma vez", "posso adiantar as parcelas", "pagar adiantado ajuda a contemplar"]
    answer: "Adiantar parcelas não antecipa a contemplação: ela continua acontecendo nas assembleias, por sorteio ou lance. Como usar um valor a mais, por exemplo num lance, segue o regulamento do grupo, e o consultor mostra essas regras."
  - id: reduced_installment
    question: Por que a parcela aumenta depois da contemplação?
    variants: ["a parcela sobe depois de contemplar", "por que depois fica mais cara", "o que é parcela reduzida", "o que é meia parcela"]
    answer: "Nos planos com parcela reduzida, você paga uma parcela menor até a contemplação. Depois dela, a parcela passa ao valor cheio e a diferença do período reduzido é distribuída nas parcelas seguintes, conforme o contrato do grupo."
  - id: embedded_bid
    question: O que é lance embutido?
    variants: ["como funciona o lance embutido", "dá pra dar lance sem dinheiro", "posso dar lance com a própria carta", "posso dar lance no primeiro mês"]
    answer: "No lance embutido, uma parte do próprio crédito é usada para ofertar o lance, sem tirar dinheiro do bolso. Se você for contemplado assim, o crédito liberado fica menor nessa mesma parte. O limite e as regras estão no regulamento do grupo."
  - id: how_many_contemplated
    question: Quantas pessoas são contempladas por mês?
    variants: ["qual a chance de ser contemplado", "taxa de contemplação", "quantos contemplam por mês", "quantas contemplações tem"]
    answer: "Todo mês há contemplação por sorteio e por lance. Quantas pessoas são contempladas depende do grupo, de quantos participantes pagam em dia e dos lances ofertados. Por isso não existe prazo garantido."
  - id: odd_credit_value
    question: Por que algumas cartas têm valor quebrado?
    variants: ["por que a carta não é redonda", "por que tem carta de valor diferente", "qual a diferença de uma carta mais antiga"]
    answer: "O crédito é reajustado pelo índice previsto no contrato, normalmente uma vez por ano. Em grupos que já estão em andamento, o crédito costuma ter um valor diferente do redondo, e a parcela acompanha esse reajuste."
  - id: vs_saving
    question: Vale mais a pena consórcio ou guardar o dinheiro?
    variants: ["não vale mais a pena investir", "por que não deixo o dinheiro rendendo", "melhor juntar o dinheiro", "consórcio ou poupança", "consórcio é investimento"]
    answer: "Aplicação e consórcio são coisas diferentes: a aplicação é investimento, e o consórcio é a forma planejada de comprar o bem. Guardando o dinheiro por conta própria, você só compra depois de juntar o valor todo, o que costuma levar anos. No consórcio, você já concorre todo mês, por sorteio ou lance, e não paga juros: o custo é a taxa de administração, conforme o contrato do grupo. Só não existe prazo garantido para a contemplação."
  - id: keep_paying
    question: Depois de contemplado, continuo pagando?
    variants: ["depois que contemplar ainda pago", "quando sou contemplado paro de pagar", "as parcelas continuam depois"]
    answer: "Sim. A contemplação libera o uso do crédito, e as parcelas seguem até o fim do plano, conforme o contrato do grupo."
