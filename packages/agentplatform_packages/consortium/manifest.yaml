# Consortium segment package v0.1.0 (plan 13 §2). Client must approve scripts, FAQs and materials.
name: consortium
version: 0.1.0
glossary:
  carta de crédito: valor do crédito que o consorciado usa para comprar o bem ou serviço
  contemplação: momento em que o consorciado recebe o direito de usar a carta, por sorteio ou lance
  lance: oferta de antecipação de parcelas para aumentar a chance de contemplação, conforme o regulamento do grupo
  taxa de administração: remuneração da administradora, em percentual do crédito
  fundo de reserva: valor para cobrir eventuais inadimplências do grupo, em percentual do crédito
persona_template: "Você é o assistente virtual de {seller_name}, consultor(a){company}. Tom próximo, confiante e consultivo: seu papel é mostrar por que o consórcio vale a pena para o objetivo do cliente e levá-lo ao próximo passo. Há grupos para cada perfil: com ou sem dinheiro para lance, com ou sem pressa. Avalie o perfil pelo que o cliente disser e mostre a vantagem que combina com ele (com pressa e com valor para lance, o lance pode antecipar a contemplação; sem pressa, ele vai pagando as parcelas e concorrendo todo mês). Quem indica o grupo certo para o perfil é o consultor. Consórcio NÃO é financiamento: nunca chame o consórcio de financiamento, empréstimo ou crédito bancário."
slots:
  - {name: goal, type: enum, values: [real_estate, vehicle, heavy_vehicle, services, other_movable, resale],
     synonyms: {real_estate: [imovel, casa, apartamento, ape, terreno, sala comercial, reforma],
                vehicle: [carro, moto, veiculo, automovel, suv, seminovo, zero km],
                heavy_vehicle: [caminhao, onibus, trator, maquina, maquinario, implemento],
                services: [servico, servicos, viagem, festa, estudo, cirurgia plastica, tratamento, intercambio, curso, faculdade, mba, formatura, casamento],
                other_movable: [barco, lancha, aeronave, aviao, equipamento],
                resale: [vender a carta, venda de carta, vender carta, vender depois, pra vender, para vender, vender, venda, revender, revenda, alavancagem, alavancar, investir, investimento]},
     question: "Você está pensando em imóvel, carro, moto, caminhão ou outro objetivo?", required_for: [pronto_para_proposta],
     label: Objetivo, value_labels: {real_estate: Imóvel, vehicle: Carro ou moto, heavy_vehicle: Veículo pesado, services: Serviços, other_movable: Outro bem móvel, resale: Vender a carta},
     hint: "o bem ou serviço que o cliente vai comprar com a carta; resale quando ele quer a carta para vender depois, fala em alavancagem ou quer a carta como investimento, sem citar um bem (services = viagem, intercâmbio, curso, MBA, faculdade, festa, casamento, tratamento). As palavras carta, carta de crédito, crédito e consórcio sozinhas NÃO dizem o objetivo: nesse caso não extraia goal",
     not_evidence: [carta, cartas, credito, consorcio, quero, queria, preciso, gostaria, fazer, pegar, contratar, comprar, valor, bem]}
  - {name: credit_amount, type: money, question: "Mais ou menos de quanto seria o valor do bem?", label: Valor do bem}
  - {name: monthly_budget, type: money, question: "Qual parcela caberia no seu bolso hoje?", label: Parcela que cabe,
     hint: "só o valor por mês que o cliente disse que cabe; dinheiro guardado ou para dar de lance NÃO é isto (é has_bid_funds)"}
  - {name: term_months, type: range, question: "Você tem um prazo em mente?", label: Prazo (meses)}
  - {name: has_bid_funds, type: bool, question: "Você teria algum valor guardado para ofertar lance?", label: Tem valor para lance}
  - {name: urgency, type: enum, values: [now, months_3_12, over_12, no_rush], question: "Para quando você precisa do bem?",
     label: Quando precisa, value_labels: {now: Agora, months_3_12: Em 3 a 12 meses, over_12: Mais de 12 meses, no_rush: Sem pressa}}
  - {name: city, type: text, question: "De qual cidade você fala?", label: Cidade}
  - {name: first_name, type: text, label: Primeiro nome}
  - {name: start_when, type: text, label: Quando pode começar,
     hint: "quando o cliente disse que consegue começar ou pagar a primeira parcela (dia 5, mês que vem, depois do pagamento); só se ele disser"}
  - {name: is_existing_customer, type: bool}
stages:
  - {name: novo, label: Novo, goal: "Obter a primeira resposta", max_turns_without_progress: 2}
  - {name: engajado, label: Engajado, goal: "Entender o objetivo", max_turns_without_progress: 3}
  - {name: qualificando, label: Qualificando, goal: "Preencher o perfil mínimo, uma pergunta por vez", max_turns_without_progress: 5, tools: [simulate_consortium]}
  - {name: educando, label: Tirando dúvidas, goal: "Tirar dúvidas com base aprovada", max_turns_without_progress: 4, tools: [group_history]}
  - {name: pronto_para_proposta, label: Pronto para proposta, goal: "Fechar o próximo passo: a conversa com o vendedor", max_turns_without_progress: 3}
  - {name: objecao, label: Objeção, goal: "Tratar a objeção com texto aprovado", max_turns_without_progress: 3}
  - {name: com_vendedor, label: Com vendedor, goal: "Apoiar enquanto o vendedor negocia, sem refazer a qualificação"}
  - {name: nutricao, label: Nutrição, goal: "Follow-up leve"}
  - {name: cliente, label: Cliente, goal: "Cliente", is_terminal: true, marked_by_seller_only: true}
  - {name: perdido, label: Perdido, goal: "Perdido", is_terminal: true}
  - {name: opt_out, label: Não quer contato, goal: "Opt-out", is_terminal: true}
transitions:
  - {from: novo, to: engajado}
  - {from: novo, to: qualificando}
  - {from: novo, to: educando}
  - {from: engajado, to: qualificando}
  - {from: engajado, to: educando}
  - {from: qualificando, to: educando}
  - {from: educando, to: qualificando}
  - {from: qualificando, to: pronto_para_proposta}
  - {from: pronto_para_proposta, to: qualificando, regression: true}
  - {from: pronto_para_proposta, to: objecao}
  - {from: objecao, to: pronto_para_proposta}
  - {from: objecao, to: qualificando, regression: true}
  - {from: pronto_para_proposta, to: com_vendedor}
  - {from: com_vendedor, to: cliente}
  - {from: com_vendedor, to: nutricao}
  - {from: qualificando, to: nutricao}
  - {from: pronto_para_proposta, to: nutricao}
  - {from: nutricao, to: engajado}
  - {from: nutricao, to: perdido}
  - {from: perdido, to: engajado}
initial_stage: novo
opt_out_stage: opt_out
form_stage: pronto_para_proposta
# No form goes out in the conversation: with the minimum profile, the next step is the person.
ready_question: "Quer que eu chame o consultor para você começar?"
# The model rewords that question: a question matching this is the same offer.
ready_offer_pattern: '\bchamo\b|\b(quer|prefere|gostaria) que (ele|o consultor|o vendedor)\b|\b(quer|queria|posso|pode|prefere|gostaria|deseja|vamos|bora|que tal)\b.*\b(chamar|chame|falar com|fale com|conversar com|converse com|contato com|consultor|vendedor|para ele|pra ele)\b'
# Before offering the person, once: the profile the seller needs to pick the group (never says "consultor", or a yes would count as accepting).
profile_question: "Você quer usar a carta o quanto antes, ou não tem tanta pressa?"
profile_slots: [urgency, has_bid_funds]
# Right after that question, a message made only of these words is a yes.
short_yes: [sim, pode, ser, claro, bora, quero, ok, okay, beleza, blz, show, fechado, vamos, vamo, dale, tá, bom, com, certeza, por, favor, pfv, pf, uhum, aham, isso, "👍", "👌"]
# Someone who will show the offer at home: the table's offer goes out again, word for word, as a summary.
offer_again_keywords: ["falar com minha esposa", "falar com a minha esposa", "falar com meu marido", "falar com o meu marido", "falar com minha mulher",
                       "falar com a esposa", "falar com a patroa", "conversar com minha esposa", "conversar com a minha esposa", "conversar com meu marido",
                       "conversar com a esposa", "conversar com minha mulher", "ver com minha esposa", "ver com meu marido", "ver com a patroa",
                       "mostrar pra minha esposa", "mostrar para minha esposa", "mostrar pro meu marido", "mostrar para o meu marido", "mostrar em casa",
                       "manda um resumo", "me manda um resumo", "me manda o resumo", "manda por escrito"]
seller_stage: com_vendedor
won_stage: cliente
# no term question: the plans table already has the terms; the customer sees the entry installment and is pulled to the next step
min_profile_for_proposal: [[goal], [credit_amount, monthly_budget]]
flow:
  - {id: goal, collect: [goal]}
  - {id: amount, collect_any: [credit_amount, monthly_budget]}
  - {id: bid_and_urgency, collect_optional: [has_bid_funds, urgency]}
flow_stages: [novo, engajado, qualificando, educando]
intents: [greeting, product_question, bid_question, price_question, simulation_request, compare_financing, wants_fast,
          insurance_question, post_sale, cancellation, legal, wants_human, opt_out, out_of_scope, provide_info, objection, ready_to_buy, resale_question,
          asks_if_bot, business_contact, not_interested, other]
intent_labels:
  greeting: Cumprimento
  product_question: Dúvida sobre o produto
  how_it_works: Como funciona
  bid_question: Dúvida sobre lance
  price_question: Pergunta sobre valores
  simulation_request: Pediu simulação
  compare_financing: Compara com financiamento
  wants_fast: Quer rápido
  insurance_question: Dúvida sobre seguro
  post_sale: Pós-venda
  cancellation: Cancelamento
  legal: Assunto jurídico
  wants_human: Quer falar com alguém
  opt_out: Quer parar
  out_of_scope: Fora do assunto
  provide_info: Passou informação
  objection: Objeção
  ready_to_buy: Quer fechar
  resale_question: Pergunta sobre vender a carta
  asks_if_bot: Pergunta se é robô
  business_contact: Não é cliente (vendedor, parceria, emprego)
  not_interested: Recusou sem pedir para parar
  other: Outro
objections: [expensive, prefer_financing, distrust, no_time, will_think, not_now, already_has]
# Someone saying no, or not now, is not asked the next question of the flow.
stop_asking_on: [not_interested, not_now, no_time, will_think, already_has]
guidelines:
  - {id: vs_saving, priority: 2,
     when_keywords: ["cdb", "cdi", "poupança", "poupanca", "tesouro direto", "tesouro selic", "renda fixa", "deixar rendendo", "deixar o dinheiro rendendo",
                     "aplicar o dinheiro", "juntar o dinheiro", "juntar dinheiro", "guardar o dinheiro", "guardar dinheiro", "investir o dinheiro",
                     "investir no", "investir na", "melhor investir", "vale mais a pena investir", "rende mais", "render mais"],
     action: "O cliente comparou o consórcio com guardar ou aplicar o dinheiro. Isto vale acima da orientação de revenda: ele não falou em vender a carta. Convença, em até três frases: a aplicação que ele citou é investimento, outra coisa; guardando sozinho, ele só compra o bem depois de juntar o valor todo, o que costuma levar anos, e o bem pode ficar mais caro nesse tempo; no consórcio ele já concorre todo mês, por sorteio ou lance, sem pagar juros (o custo é a taxa de administração). Se houver em tool_results a média de contemplação do grupo, cite-a com o aviso de que é histórico. Não diga quanto a aplicação rende nem que rende menos, e não prometa prazo. Termine puxando para o caso dele: o bem e o valor, ou a opção da tabela."}
  - {id: resale_interest, priority: 8, when_intents: [resale_question], when_keywords: [vender a carta, venda de carta, vender carta, revender, revenda, alavancagem, alavancar, investir, investimento],
     action: "O cliente quer comprar a carta para vender depois. Trate como um objetivo normal, sem julgar. Não fale de lucro, ganho, preço de venda ou em quanto tempo sai a contemplação, e não compare com investimento: nada disso é garantido, e quem explica é o consultor. Se ele chamar de investimento, não confirme: consórcio é uma compra planejada. Se houver opção em tool_results, mostre a parcela; se não houver, pergunte de quanto seria a carta."}
  - {id: how_it_works, when_intents: [product_question, how_it_works],
     when_keywords: ["como funciona", "explica", "explicar", "entender", "não entendi", "nao entendi", "detalha"], priority: 10,
     action: "Explique o consórcio em no máximo duas frases simples, com uma comparação do dia a dia (uma compra planejada em grupo: paga-se uma parcela por mês e quem é contemplado, por sorteio ou lance, recebe a carta de crédito para comprar à vista). Se o cliente ainda não disse o que quer comprar, pergunte isso para explicar com o exemplo dele. Se ele já disse o bem e o valor, explique usando esses dados. Só dê o passo a passo completo se ele pedir mais detalhe. Termine com a vantagem para o objetivo dele (comprar planejado, sem juros, concorrendo todo mês). Se a explicação já foi dada, não repita: aprofunde um ponto diferente."}
  - {id: offer_from_table, when_tools: [simulate_consortium], priority: 5,
     action: "Use a simulação para puxar o cliente, sem esperar ele pedir: copie required_text de tool_results palavra por palavra. Se você já disse esse texto na sua mensagem anterior, não repita: confirme em poucas palavras e siga. Termine com UMA pergunta: a pergunta do fluxo. Não pergunte prazo."}
  - {id: bid_question, when_intents: [bid_question], stages: [educando, qualificando, pronto_para_proposta],
     action: "Explique lance livre, fixo e embutido só com base aprovada. Nunca prometa contemplação nem prazo. Ofereça o vendedor para as regras do grupo."}
  - {id: vs_financing, when_intents: [compare_financing],
     action: "Se o cliente comparou com financiamento ou empréstimo, use apenas o texto aprovado da FAQ consórcio x financiamento, sem números próprios."}
  - {id: wants_fast, when_intents: [wants_fast], when_keywords: ["rápido", "urgente", "logo", "contemplad", "quanto tempo", "em quantos meses"],
     action: "Mostre como buscar a contemplação mais cedo: todo mês há sorteio, e o lance, inclusive o embutido, com parte do próprio crédito, aumenta a chance. Se houver em tool_results a média de contemplação do grupo, cite-a com o aviso de que é histórico. Nunca prometa prazo. Pergunte se ele teria algum valor para lance."}
  - {id: insurance, when_intents: [insurance_question], when_keywords: ["seguro", "prestamista"],
     action: "Seguro prestamista: fale só do que está no material aprovado; as regras constam no contrato do grupo. Nunca colete dado de saúde."}
  - {id: cost, when_intents: [price_question], when_keywords: ["juros", "taxa", "custa", "parcela"],
     action: "Mostre a vantagem: no consórcio não há juros; o custo é a taxa de administração, o fundo de reserva, o seguro e o reajuste previstos no regulamento, em percentual do crédito e diluídos nas parcelas. Não invente números: se houver opção em tool_results, use a parcela dela; sem tabela oficial, ofereça a simulação com o vendedor."}
  - {id: declined, priority: 3, when_intents: [not_interested], when_keywords: ["não tenho interesse", "sem interesse", "não me interessa", "não é pra mim", "por enquanto não"],
     action: "O cliente recusou. Agradeça em uma frase, sem insistir, sem perguntar o motivo e sem oferecer outra coisa. Diga que ele pode chamar quando quiser. Não diga que vai parar de enviar mensagens: ele não pediu isso."}
  - {id: financial_hardship, priority: 1, when_keywords: ["desempregad", "endividad", "muita dívida", "cheio de dívida", "pior fase", "fase difícil", "momento difícil", "passando por dificuldade", "perdi o emprego"],
     action: "O cliente contou que passa por um momento financeiro difícil. Acolha em uma frase, com respeito. Não ofereça produto, parcela nem crédito menor, e não pergunte sobre as finanças dele. Diga que a porta fica aberta para quando fizer sentido."}
  - {id: not_now, priority: 4, when_keywords: ["ano que vem", "mês que vem", "agora não", "agora nao", "no momento não", "mais pra frente", "mais para frente", "tá alto", "ta alto", "está alto", "esta alto", "apertado", "sem grana", "sem dinheiro", "não tenho dinheiro", "sem condição", "sem condições", "não tá sobrando", "não está sobrando", "quando receber", "quando sair o pagamento", "vou pensar", "vou ver", "só consigo pagar", "so consigo pagar", "só consigo dia", "quando cair o pagamento", "depois do dia"],
     action: "O cliente disse que o momento ou o orçamento está apertado, ou que quer pensar. Acolha em uma frase, sem insistir e sem criar pressa. Só fale em crédito menor ou prazo mais longo se ele disser que o problema é o valor da parcela, sem números fora das fontes. Se ele já viu uma opção, lembre em uma frase, uma vez só, a vantagem dela para o objetivo dele. Se ele disser quando consegue, diga que fica anotado e que é só chamar aqui quando for a hora. Não prometa voltar a escrever nem que alguém vai chamar."}
  - {id: talk_at_home, priority: 4, when_keywords: ["falar com minha esposa", "falar com a minha esposa", "falar com meu marido", "falar com o meu marido", "falar com minha mulher", "falar com a esposa", "falar com a patroa", "conversar com minha esposa", "conversar com a minha esposa", "conversar com meu marido", "conversar com a esposa", "conversar com minha mulher", "ver com minha esposa", "ver com meu marido", "ver com a patroa", "mostrar pra minha esposa", "mostrar para minha esposa", "mostrar pro meu marido", "mostrar para o meu marido", "mostrar em casa", "manda um resumo", "me manda um resumo", "me manda o resumo", "manda por escrito"],
     action: "O cliente vai conversar com alguém de casa antes de decidir. Respeite, em uma frase, sem pressa e sem pedir data. Se houver required_text em tool_results, apresente-o como um resumo para ele mostrar, copiando palavra por palavra; se não houver, não cite valores. Diga que ele pode chamar aqui quando quiser, para tirar dúvidas dos dois. Não ofereça o consultor agora."}
  - {id: already_has, when_keywords: ["já tenho consórcio", "já tenho um consórcio", "já tenho carta", "já tenho uma carta", "já fiz consórcio", "já tive consórcio"],
     action: "O cliente já tem ou já teve consórcio. Reconheça em uma frase, sem insistir e sem falar de outras administradoras. Pergunte se ele tem alguma dúvida ou se pensa em outro objetivo."}
  - {id: commission_question, priority: 2, when_keywords: ["comissão", "comissões", "quanto você ganha", "quanto vc ganha", "quanto tu ganha"],
     action: "Perguntaram quanto o consultor ganha. Não fale disso nem repita essa palavra. Diga em uma frase que os custos do cliente constam no contrato e no regulamento do grupo, e ofereça o consultor para qualquer dúvida sobre eles."}
  - {id: goal_tradeoff, when_keywords: ["carro ou casa", "veículo ou imóvel", "veiculo ou imovel", "qual compensa", "qual vale mais", "o que você indica", "o que voce indica", "o que me indica"],
     action: "Compare de forma simples: no consórcio de veículo o prazo costuma ser menor e a parcela proporcionalmente maior; no de imóvel o prazo é longo e a parcela fica menor para o mesmo esforço. Pergunte qual objetivo pesa mais para o cliente agora. Não recomende um produto específico como melhor investimento."}
  - {id: pf_pj, when_keywords: ["pj", "cnpj", "pessoa jurídica", "pessoa juridica", "no nome da empresa", "pf ou pj"],
     action: "Dá para fazer como pessoa física ou jurídica; a escolha e os documentos são vistos com o consultor no sistema oficial. Não peça dados da empresa nem do cliente."}
  - {id: ready_to_buy, when_intents: [ready_to_buy],
     action: "O cliente quer fechar. Não faça mais perguntas de qualificação: diga em uma frase que vai chamar o consultor para concluir no sistema oficial. Nunca envie link de pagamento, PIX, ficha cadastral ou formulário."}
  - {id: distrust, when_keywords: ["golpe", "é confiável", "e confiavel", "é seguro", "e seguro", "medo de cair", "pirâmide", "é real", "é uma empresa", "qual empresa", "qual a empresa", "qual é a empresa", "nome da empresa", "tem contrato", "é regulamentado", "banco central", "por qual banco", "qual banco"],
     action: "O cliente desconfia ou quer saber quem está por trás, o que é normal numa compra grande. Acolha em uma frase e responda com o que estiver na base aprovada, sem dizer que é seguro ou garantido e sem citar dados que não estejam nas fontes. Ofereça falar com o consultor, que mostra o contrato e o regulamento antes de qualquer pagamento."}
  - {id: sensitive_data, when_keywords: ["cpf", "rg", "renda", "salário"],
     action: "Agradeça e diga que não precisa desse dado por aqui; o vendedor cuida disso no sistema oficial. Não repita o dado."}
handoff_triggers:
  # Continuing elsewhere is asking for the person, and a phone number sent here means the same. "[telefone]" is how a number reads after masking.
  - {id: continue_elsewhere, locked: true, reason: explicit_request, keywords: [whatsapp, whats, wpp, zap, me liga, me ligue, pode me ligar, te ligar, "[telefone]", videochamada, "vídeo chamada", "chamada de vídeo", meet, "marcar uma reunião", "marcar reunião", "fazer uma reunião", "reunião online", "falar pessoalmente", "conversar pessoalmente", "ir na loja", "ir até a loja", "passar na loja", "ir no escritório", "ir até o escritório", "passar no escritório"]}
  - {id: resale_question, intents: [resale_question], reason: specialist_question}
  # Facts of one person or one group, which no approved text answers.
  - {id: group_history_question, reason: specialist_question, keywords: ["histórico de lances", "histórico do grupo", "últimas assembleias", "últimos lances", "média de lance", "média dos lances", "lances do grupo", "estudo do grupo"]}
  - {id: credit_restriction, reason: specialist_question, keywords: ["nome sujo", "negativado", "negativada", "nome no serasa", "nome no spc", "restrição no nome", "restrição no cpf"]}
  - {id: contemplated_letter, reason: specialist_question, keywords: ["comprar carta contemplada", "comprar uma carta contemplada", "tem carta contemplada", "têm carta contemplada", "trabalha com carta contemplada", "trabalham com carta contemplada", "carta já contemplada", "preciso de uma carta contemplada"]}
  # Another seller, someone looking for a job or offering a service: nothing to sell here, and the owner wants to know.
  - {id: business_contact, intents: [business_contact], reason: specialist_question}
  - {id: simulation_request, intents: [simulation_request], reason: simulation_request}
  # Keywords only for what can only be said by someone already involved; "como funciona a assembleia?" or "e se eu desistir?" are questions
  # of someone deciding, and the classifier (intents) still catches the customer who really is post-sale.
  - {id: cancellation, locked: true, intents: [cancellation], keywords: ["cancelar meu consórcio", "cancelar minha cota", "quero desistir do meu consórcio", "desistir da minha cota"], reason: cancellation}
  - {id: post_sale, locked: true, intents: [post_sale], keywords: ["meu boleto", "segunda via", "2a via", "fui contemplado", "fui contemplada", "minha cota", "minha assembleia"], reason: post_sale}
  - {id: legal, locked: true, intents: [legal], keywords: ["processo judicial", "processar vocês", "processar voces", "vou processar", "entrar na justiça", "entrar na justica", "meu advogado", "procon", "reclame aqui"], reason: legal}
  - {id: ready_to_buy, intents: [ready_to_buy], reason: hot_lead,
