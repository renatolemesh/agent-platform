# Prometheus for the obs profile (plan 10 §1, runbook docs/runbooks/observabilidade.md). Mounted read-only at /etc/prometheus.
# /metrics runs its SQL at scrape time, so one minute is the right cadence: the same as the in-app alerts, and a faster
# scrape would only add load to Postgres.
global:
  scrape_interval: 60s
  scrape_timeout: 15s
  evaluation_interval: 60s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: agentplatform-api
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/metrics_token      # the same value as the app's METRICS_TOKEN
    static_configs:
      - targets: ["api:8000"]

  - job_name: otel-collector                            # the collector's own telemetry
    static_configs:
      - targets: ["otel-collector:8888"]

  - job_name: otel-spanmetrics                          # counters and latency derived from spans
    static_configs:
      - targets: ["otel-collector:8889"]
    metric_relabel_configs:
      # The instance id changes at every collector restart: keeping it would start new series each time.
      - regex: "collector_instance_id|otel_scope_.*"
        action: labeldrop

  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]
