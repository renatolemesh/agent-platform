; Grafana for the obs profile. No secret here: the admin password comes from GF_SECURITY_ADMIN_PASSWORD__FILE.
[server]
; Reached only through 127.0.0.1 (SSH tunnel in production)
root_url = http://127.0.0.1:8130/

[users]
allow_sign_up = false

[auth.anonymous]
enabled = false

[security]
disable_gravatar = true
cookie_samesite = strict

; Nothing leaves this machine on its own, and no extra plugin is downloaded at startup
[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false

[news]
news_feed_enabled = false

[plugins]
preinstall_disabled = true

; Alert rules live in Prometheus (docker/obs/prometheus/rules), one place only
[unified_alerting]
enabled = false

[log]
level = warn
