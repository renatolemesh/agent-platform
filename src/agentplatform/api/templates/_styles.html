<style>
:root{
  --bg:#f5f4ef;--surface:#ffffff;--surface-2:#faf9f5;--line:#e4e1d8;--line-2:#eeece5;
  --fg:#1c1b18;--fg-2:#3d3b35;--muted:#6b675e;--faint:#9a958a;
  --accent:#0e6b4e;--accent-hover:#0b5b42;--accent-fg:#ffffff;--accent-soft:#e3f0ea;--accent-ink:#0b5b42;
  --ok:#17764f;--ok-soft:#e5f3ec;--warn:#95590a;--warn-soft:#fbf2df;--bad:#b42318;--bad-soft:#fcebe9;
  --info:#27608f;--info-soft:#e8f1f8;--muted-soft:#eeece5;
  --side:#10261f;--side-fg:#cfdfd8;--side-muted:#83a094;--side-hover:#1a362d;--side-on:#ffffff;--side-line:#1f3d33;--side-mark:#7ee2b8;
  --input-line:#d5d1c6;--radius:12px;--radius-sm:8px;
  --shadow:0 1px 2px rgba(28,27,24,.04);--shadow-lg:0 10px 30px rgba(28,27,24,.13);
  --sans:"Segoe UI Variable Text","Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"Cascadia Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#121411;--surface:#1a1c18;--surface-2:#161814;--line:#2d302a;--line-2:#242720;
  --fg:#eeede8;--fg-2:#d3d1c9;--muted:#a3a096;--faint:#716e65;
  --accent:#57c79c;--accent-hover:#6dd3ab;--accent-fg:#0b1a14;--accent-soft:#17312a;--accent-ink:#8fdcbd;
  --ok:#5fcb9f;--ok-soft:#14302a;--warn:#e5b45c;--warn-soft:#33270f;--bad:#f2867c;--bad-soft:#38191a;
  --info:#7ab6e3;--info-soft:#14293a;--muted-soft:#262922;
  --side:#0c1512;--side-hover:#172620;--side-line:#1c2c26;--input-line:#3a3d36;
  --shadow:none;--shadow-lg:0 10px 30px rgba(0,0,0,.5)}}
*{box-sizing:border-box}
html,body{margin:0}
body{font:14px/1.5 var(--sans);background:var(--bg);color:var(--fg);-webkit-font-smoothing:antialiased}
a{color:var(--accent-ink);text-decoration:none}a:hover{text-decoration:underline}
h1{font-size:24px;line-height:1.25;margin:0;font-weight:650;letter-spacing:-.015em}
h2{font-size:15.5px;line-height:1.35;margin:0 0 12px;font-weight:620;letter-spacing:-.005em}h3{font-size:14px;margin:0 0 8px;font-weight:620}
p{margin:0 0 10px}code{font-family:var(--mono);font-size:12.5px;background:var(--muted-soft);padding:1px 6px;border-radius:5px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.i{flex:none;vertical-align:-3px}

/* ---- shell ---- */
.shell{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.side{background:var(--side);color:var(--side-fg);display:flex;flex-direction:column;padding:16px 10px 10px;position:sticky;top:0;height:100vh;overflow:hidden}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 14px;color:#fff;font-weight:640;font-size:14.5px;letter-spacing:-.005em}
.brand .mark{width:28px;height:28px;border-radius:8px;background:var(--side-mark);display:grid;place-items:center;font-size:11.5px;font-weight:800;color:#0c2a20;letter-spacing:0;flex:none}
.brand small{display:block;font-weight:450;font-size:11.5px;color:var(--side-muted);letter-spacing:0}
.nav-menu{flex:1 1 auto;min-height:0;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--side-line) transparent}.nav-menu>summary{display:none}
.nav-group{margin:0 0 6px}.nav-group h4{font-size:11.5px;color:var(--side-muted);margin:12px 8px 3px;font-weight:550}
.side a.nav{display:flex;align-items:center;gap:9px;padding:5.5px 8px;border-radius:7px;color:var(--side-fg);text-decoration:none;font-size:13.5px}
.side a.nav .i{opacity:.75}
.side a.nav:hover{background:var(--side-hover);color:#fff}
.side a.nav.on{background:var(--side-hover);color:var(--side-on);font-weight:600}.side a.nav.on .i{color:var(--side-mark);opacity:1}
.side .me{flex:none;border-top:1px solid var(--side-line);padding:10px 6px 0;margin-top:6px;display:flex;align-items:center;gap:8px}
.side .me .avatar{background:var(--side-hover);color:var(--side-mark)}
.side .me .who{flex:1;min-width:0}.side .me .who b{display:block;color:#fff;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side .me .who span{font-size:11.5px;color:var(--side-muted)}
.side .me a{color:var(--side-fg);padding:5px;border-radius:6px;display:inline-flex}.side .me a:hover{background:var(--side-hover);color:#fff}
.content{padding:32px 40px 72px;max-width:1240px;width:100%;min-width:0;margin-inline:auto}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:24px;flex-wrap:wrap}
.page-head .sub{color:var(--muted);margin:5px 0 0;max-width:720px}
.crumb{display:inline-flex;align-items:center;gap:4px;color:var(--muted);font-size:13px;margin-bottom:8px}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* ---- surfaces ---- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin-bottom:18px;overflow-wrap:break-word}
.card.flush{padding:0;overflow:hidden}.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.card-head h2{margin:0}.card-head .sub{color:var(--muted);font-size:13px;margin:2px 0 0}
.card-body{padding:20px}
.grid{display:grid;gap:18px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g-side{grid-template-columns:minmax(0,1fr) 340px}.g-nav{grid-template-columns:280px minmax(0,1fr)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:1px;margin-bottom:18px;background:var(--line);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
.kpi{background:var(--surface);padding:15px 20px}
.kpi .label{color:var(--muted);font-size:12.5px;display:flex;align-items:center;gap:6px}.kpi .label .i{display:none}
.kpi .value{font-size:26px;line-height:1.2;font-weight:640;letter-spacing:-.02em;margin-top:3px;font-variant-numeric:tabular-nums}
.kpi .hint{color:var(--muted);font-size:12px;margin-top:1px}
.kpi.warn .value{color:var(--warn)}.kpi.bad .value{color:var(--bad)}.kpi.ok .value{color:var(--ok)}
/* settings: what it is on the left, the fields on the right */
.section{display:grid;grid-template-columns:230px minmax(0,1fr);gap:8px 32px;margin-bottom:26px}
.section-head h2{margin:2px 0 4px}.section-head p{color:var(--muted);font-size:13px;margin:0}
.section>.card{margin-bottom:0}
.savebar{position:sticky;bottom:12px;z-index:5;display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;padding:12px 16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-lg)}
.savebar .field{flex:1;min-width:220px;margin:0}
/* a list of things that can each be opened and edited in place */
.items{list-style:none;margin:0;padding:0}
.item{padding:16px 20px;border-bottom:1px solid var(--line-2)}.item:last-child{border-bottom:0}
.item-row{display:flex;gap:16px;align-items:flex-start}.item-main{flex:1;min-width:0}
.item-title{font-weight:600;margin:0 0 2px}.item-text{color:var(--fg-2);margin:0}.item-meta{color:var(--muted);font-size:12.5px;margin-top:4px}
.item-side{display:flex;align-items:center;gap:6px;flex:none;flex-wrap:wrap;justify-content:flex-end}
details.edit>summary{list-style:none;display:inline-flex;color:var(--fg);font-weight:550}details.edit>summary::before{content:none}
details.edit[open]{flex-basis:100%}
.editor{margin-top:14px;padding:16px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius-sm)}
.filters{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:14px}
.filters a{padding:5px 11px;border-radius:999px;color:var(--fg-2);font-size:13px;border:1px solid transparent}.filters a:hover{background:var(--muted-soft);text-decoration:none}
.filters a.on{background:var(--surface);border-color:var(--line);font-weight:600;box-shadow:var(--shadow)}

/* ---- tables ---- */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-weight:550;color:var(--muted);font-size:12.5px;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px 14px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.card.flush th:first-child,.card.flush td:first-child{padding-left:20px}.card.flush th:last-child,.card.flush td:last-child{padding-right:20px}
tr:last-child td{border-bottom:0}tbody tr:hover td{background:var(--surface-2)}
tr.turn td{border-bottom:0;padding-bottom:3px}tr.turn-why td{padding-top:0}tr.turn:hover td,tr.turn-why:hover td{background:none}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.card table{margin:0}
.empty{text-align:center;color:var(--muted);padding:40px 16px}
.empty .i{color:var(--faint);margin-bottom:6px}

/* ---- badges ---- */
.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:6px;font-size:12.5px;font-weight:550;white-space:nowrap;background:var(--muted-soft);color:var(--fg-2)}
.badge.accent{background:var(--accent-soft);color:var(--accent-ink)}.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}.badge.bad{background:var(--bad-soft);color:var(--bad)}
.badge.info{background:var(--info-soft);color:var(--info)}.badge.muted{background:var(--muted-soft);color:var(--muted)}
.muted{color:var(--muted)}.small{font-size:12.5px}.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}
.money{font-variant-numeric:tabular-nums;border-bottom:1px dotted var(--faint);cursor:help;white-space:nowrap}
.nowrap{white-space:nowrap}.mono{font-family:var(--mono);font-size:12.5px}

/* ---- buttons & forms ---- */
.btn,button{display:inline-flex;align-items:center;justify-content:center;gap:6px;font:inherit;font-weight:550;font-size:13.5px;line-height:1.15;padding:8px 13px;border-radius:var(--radius-sm);border:1px solid var(--input-line);background:var(--surface);color:var(--fg);cursor:pointer;text-decoration:none;white-space:nowrap;box-shadow:var(--shadow);transition:background .12s,border-color .12s}
.btn:hover,button:hover{background:var(--surface-2);border-color:var(--faint);text-decoration:none}
button:disabled,.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn-primary,button.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn-primary:hover,button.btn-primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn-danger,button.btn-danger{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 35%,transparent);color:var(--bad);box-shadow:none}
.btn-danger:hover,button.btn-danger:hover{background:var(--bad);border-color:var(--bad);color:#fff}
.btn-ghost,button.btn-ghost{background:transparent;border-color:transparent;color:var(--fg-2);box-shadow:none}
.btn-ghost:hover,button.btn-ghost:hover{background:var(--muted-soft);border-color:transparent}
.btn-sm,button.btn-sm{padding:5px 10px;font-size:12.5px;border-radius:7px}
form.inline{display:inline}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.field label,.label{font-size:13px;font-weight:550;color:var(--fg-2)}
.field .help,.help{font-size:12.5px;color:var(--muted)}
input,select,textarea{font:inherit;font-size:14px;color:var(--fg);background:var(--surface);border:1px solid var(--input-line);border-radius:var(--radius-sm);padding:8px 10px;outline:none;min-width:0;transition:border-color .12s,box-shadow .12s}
input:hover,select:hover,textarea:hover{border-color:var(--faint)}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
input::placeholder,textarea::placeholder{color:var(--faint)}
input[type=file]{padding:6px;background:var(--surface-2)}input[type=file]::file-selector-button{font:inherit;font-weight:550;font-size:13px;margin-right:10px;padding:5px 11px;border-radius:7px;border:1px solid var(--input-line);background:var(--surface);color:var(--fg);cursor:pointer}input[type=checkbox],input[type=radio]{width:auto;accent-color:var(--accent);margin:3px 0 0;flex:none}
textarea{width:100%;line-height:1.5;resize:vertical}
textarea.code{font-family:var(--mono);font-size:12.5px;line-height:1.55}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}.row>.field{flex:1;min-width:160px;margin-bottom:0}
.row.top{align-items:flex-start;margin-bottom:14px}
.form-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}

/* ---- alerts ---- */
.alert{display:flex;gap:10px;align-items:flex-start;padding:11px 14px;border-radius:var(--radius-sm);border:1px solid;margin-bottom:16px;font-size:13.5px;color:var(--fg-2)}
.alert .i{margin-top:2px}
.alert.ok{background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 22%,transparent)}.alert.ok .i,.alert.ok b{color:var(--ok)}
.alert.warn{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 25%,transparent)}.alert.warn .i,.alert.warn b{color:var(--warn)}
.alert.bad{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 25%,transparent)}.alert.bad .i,.alert.bad b{color:var(--bad)}
.alert.info{background:var(--info-soft);border-color:color-mix(in srgb,var(--info) 22%,transparent)}.alert.info .i,.alert.info b{color:var(--info)}
.alert p{margin:0}

/* ---- misc ---- */
.avatar{width:32px;height:32px;border-radius:50%;background:var(--accent-soft);color:var(--accent-ink);display:inline-grid;place-items:center;font-weight:640;font-size:12px;flex:none}
.who-cell{display:flex;align-items:center;gap:10px;min-width:210px}.who-cell a{font-weight:600;color:var(--fg)}
td .small,td .clip{overflow-wrap:anywhere}
.clip{max-width:420px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;color:var(--muted)}
pre{white-space:pre-wrap;word-break:break-word;font-family:var(--mono);font-size:12px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius-sm);padding:12px;margin:0;max-height:520px;overflow:auto}
label.check{display:flex;gap:8px;align-items:flex-start;margin:6px 0}
details>summary{cursor:pointer;color:var(--accent-ink);font-weight:550;list-style:none}details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"▸ ";color:var(--muted)}details[open]>summary::before{content:"▾ "}
dl.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:13.5px}dl.kv dt{color:var(--muted)}dl.kv dd{margin:0;font-weight:550;word-break:break-word}
.diff-add{color:var(--ok);background:var(--ok-soft);display:block}.diff-del{color:var(--bad);background:var(--bad-soft);display:block}
.chat{display:flex;flex-direction:column;gap:8px;padding:20px;background:var(--surface-2);max-height:620px;overflow-y:auto}
.bubble{max-width:74%;padding:9px 13px;border-radius:16px;font-size:14px;line-height:1.45;white-space:pre-wrap;word-break:break-word}
.bubble .meta{display:block;font-size:11.5px;opacity:.8;margin-bottom:2px;font-weight:550}
.bubble.in{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:5px}
.bubble.out_bot{align-self:flex-end;background:var(--accent);color:var(--accent-fg);border-bottom-right-radius:5px}
.bubble.out_human{align-self:flex-end;background:var(--info);color:#fff;border-bottom-right-radius:5px}
.typing{display:inline-flex;gap:4px;vertical-align:middle}.typing i{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.35;animation:blink 1.2s infinite}.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}.typing-bubble .tick{font-size:11.5px;opacity:.75;margin-left:6px}
.bubble.out_system{align-self:center;background:var(--muted-soft);color:var(--muted);font-size:12.5px}
.timeline{list-style:none;margin:0;padding:0}.timeline li{position:relative;padding:0 0 14px 18px;font-size:13px}
.timeline li::before{content:"";position:absolute;left:3px;top:6px;width:7px;height:7px;border-radius:50%;background:var(--accent)}
.timeline li::after{content:"";position:absolute;left:6px;top:15px;bottom:0;width:1px;background:var(--line)}.timeline li:last-child::after{display:none}
.bar{height:6px;border-radius:999px;background:var(--muted-soft);overflow:hidden;min-width:80px}.bar>span{display:block;height:100%;background:var(--accent);border-radius:999px}
.bar.warn>span{background:var(--warn)}.bar.bad>span{background:var(--bad)}
.steps{margin:0 0 14px;padding-left:20px;color:var(--fg-2)}.steps li{margin-bottom:4px}
.qr{display:flex;justify-content:center}.qr svg{width:200px;height:200px;background:#fff;padding:10px;border-radius:10px;border:1px solid var(--line)}
.qr-key{text-align:center;overflow-wrap:anywhere}
.code-form{max-width:320px;margin:0 auto}.auth-card .code-form{max-width:none}.code-form input{width:100%;text-align:center;letter-spacing:.2em}.code-form button{width:100%}

/* ---- auth ---- */
.auth{min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--side)}
.auth-card{width:100%;max-width:400px;background:var(--surface);border-radius:16px;box-shadow:0 24px 60px rgba(0,0,0,.35);padding:32px}
.auth-card .brand{color:var(--fg);padding:0 0 22px}.auth-card .brand small{color:var(--muted)}
.auth-card input{width:100%}.auth-card button{width:100%;margin-top:6px}

@media (max-width:960px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{position:sticky;top:0;z-index:20;height:auto;max-height:100vh;overflow:visible;padding:8px 12px;flex-direction:row;flex-wrap:wrap;align-items:center;gap:0 8px}
  .brand{padding:0;flex:1;min-width:0}.brand small{display:none}
  .nav-menu{flex:none;display:contents;overflow:visible}.nav-menu>summary{display:inline-flex;align-items:center;gap:6px;list-style:none;color:#fff;font-weight:550;font-size:13.5px;padding:7px 10px;border-radius:7px;background:var(--side-hover);order:1}
  .nav-menu>summary::before{content:none}
  .nav-groups{order:2;flex-basis:100%;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 8px;padding:6px 0;max-height:calc(100vh - 110px);overflow-y:auto}
  .nav-group h4{grid-column:1/-1;margin-top:10px}
  .nav-group{display:grid;grid-template-columns:subgrid;grid-column:1/-1;margin:0}
  .side .me{order:3;flex-basis:100%;margin-top:0;padding:8px 0 4px}
  .nav-menu:not([open])~.me{display:none}
  .content{padding:20px 16px 56px}.g2,.g-side,.g-nav,.section{grid-template-columns:minmax(0,1fr)}.bubble{max-width:90%}
  .section{gap:10px}.savebar{position:static}
  .item-row{flex-wrap:wrap;gap:10px}.item-main{flex-basis:100%}.item-side{justify-content:flex-start}
  h1{font-size:21px}
  /* the inbox as a list: who, then where it stands. A table this wide would hide what matters behind a sideways scroll. */
  .inbox thead{display:none}
  .inbox tr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;padding:14px 20px;border-bottom:1px solid var(--line-2)}.inbox tr:last-child{border-bottom:0}
  .card.flush .inbox td{display:block;padding:0;border:0}
  .inbox td.when{grid-column:2;grid-row:1;font-size:12px;text-align:right}
  .inbox td.who{grid-column:1;grid-row:1}.inbox td.state{grid-column:1/-1;display:flex!important;flex-wrap:wrap;gap:4px 6px;align-items:center}
  .inbox td.about,.inbox td.act{grid-column:1/-1}.inbox td.about:has(.empty-text){display:none}.inbox td.act:empty{display:none}
  .card.flush .inbox td.act{text-align:left!important}
  .who-cell{min-width:0}
}
</style>
